<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام حصر وتثمين أضرار الطرق</title>
  <style>
    :root {
      --primary: #1e3a8a;
      --secondary: #0284c7;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --border: #e2e8f0;
      --danger: #ef4444;
      --success: #10b981;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 20px;
    }

    @media (max-width: 850px) {
      .container { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
      margin-bottom: 20px;
    }

    h1, h2, h3 { margin-top: 0; color: var(--primary); }
    
    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: 600;
      font-size: 0.9em;
    }

    input, select, button {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 0.95em;
    }

    .row {
      display: flex;
      gap: 10px;
    }

    .btn {
      background: var(--primary);
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
      transition: opacity 0.2s;
    }

    .btn:hover { opacity: 0.9; }
    .btn-secondary { background: var(--secondary); }
    .btn-danger { background: var(--danger); width: auto; padding: 4px 8px; }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    th, td {
      border: 1px solid var(--border);
      padding: 10px;
      text-align: right;
    }

    th { background: #f1f5f9; }

    .total-box {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      padding: 15px;
      border-radius: 8px;
      text-align: center;
      margin-top: 15px;
    }

    .total-amount {
      font-size: 1.8em;
      font-weight: bold;
      color: var(--primary);
    }

    .badge-local {
      background: #e0f2fe;
      color: #0369a1;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.85em;
      display: inline-block;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>

<div style="max-width: 1100px; margin: 0 auto 10px;">
  <span class="badge-local">💻 تعمل اللائحة محلياً بدون سيرفر</span>
</div>

<div class="container">
  
  <!-- القسم الرئيسي: حصر الأضرار والتقرير -->
  <div>
    <div class="card">
      <h2>📝 حصر أضرار الطريق</h2>
      
      <div class="form-group">
        <label>عنوان التقرير / اسم الطريق:</label>
        <input type="text" id="reportName" placeholder="مثال: أضرار طريق البريمي - المحضة">
      </div>

      <div class="row">
        <div class="form-group" style="flex: 2;">
          <label>اختر المكوّن:</label>
          <select id="compSelect"></select>
        </div>
        <div class="form-group" style="flex: 1;">
          <label>الكمية:</label>
          <input type="number" id="qty" value="1" min="0.1" step="any">
        </div>
      </div>

      <button class="btn" id="addBtn">➕ إضافة للبند الحصر</button>

      <table>
        <thead>
          <tr>
            <th>المكوّن</th>
            <th>الكمية</th>
            <th>سعر الوحدة</th>
            <th>الإجمالي</th>
            <th>إجراء</th>
          </tr>
        </thead>
        <tbody id="incTableBody"></tbody>
      </table>

      <div class="total-box">
        <div>المبلغ الإجمالي المالي:</div>
        <div class="total-amount"><span id="grandTotal">0.000</span> ر.ع.</div>
        <div id="totalWords" style="font-size: 0.9em; color: #475569; margin-top: 5px;"></div>
      </div>
    </div>
  </div>

  <!-- الشريط الجانبي: إدارة المكونات والأسعار -->
  <div>
    <div class="card">
      <h3>⚙️ قائمة المكونات والأسعار</h3>
      <p style="font-size: 0.8em; color: #64748b;">تستطيع إضافة وتعديل المكونات من الكود مباشرة أو عبر النموذج أدناه:</p>

      <table>
        <thead>
          <tr>
            <th>المكوّن</th>
            <th>الوحدة</th>
            <th>السعر</th>
          </tr>
        </thead>
        <tbody id="priceTableBody"></tbody>
      </table>
    </div>
  </div>

</div>

<script>
  // =========================================================================
  // ➕ 🛠️ التعديل المباشر: أضف أو عدّل المكونات والأسعار هنا من الكود مباشرة
  // =========================================================================
  const LOCAL_PRICES = [
    { id: 'asphalt',   name: 'الطبقة الأسفلتية (م٢)', unit: 'متر مربع', price: 2.500 },
    { id: 'aggregate', name: 'ردم وحصى (م٣)',         unit: 'متر مكعب', price: 9.000 },
    { id: 'shoulder',  name: 'أكتاف الطريق (م طولي)', unit: 'متر طولي', price: 5.000 },
    { id: 'drain',     name: 'قناة تصريف (م)',        unit: 'متر',       price: 12.000 },
    { id: 'sign',      name: 'لوحة إرشادية/تحذيرية', unit: 'عدد',       price: 40.000 },
    
    // ⬇️ يمكنك إضافة مكونات جديدة تحت هذا السطر بنفس التنسيق:
    // { id: 'curb', name: 'بردورة رصيف', unit: 'متر طولي', price: 3.500 },
  ];

  // Variables
  let incidents = [];

  // DOM Elements
  const compSelect = document.getElementById('compSelect');
  const qtyInput = document.getElementById('qty');
  const addBtn = document.getElementById('addBtn');
  const incTableBody = document.getElementById('incTableBody');
  const priceTableBody = document.getElementById('priceTableBody');
  const grandTotalEl = document.getElementById('grandTotal');
  const totalWordsEl = document.getElementById('totalWords');

  // 1. عرض جدول الأسعار والخيارات
  function initPrices() {
    compSelect.innerHTML = '';
    priceTableBody.innerHTML = '';

    LOCAL_PRICES.forEach(item => {
      // ملء القائمة المنسدلة
      const opt = document.createElement('option');
      opt.value = item.id;
      opt.textContent = `${item.name} (${item.price.toFixed(3)} ر.ع)`;
      compSelect.appendChild(opt);

      // ملء جدول الأسعار الجانبي
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${item.name}</td>
        <td>${item.unit}</td>
        <td><strong>${item.price.toFixed(3)}</strong></td>
      `;
      priceTableBody.appendChild(tr);
    });
  }

  // 2. إضافة بند للأضرار
  addBtn.addEventListener('click', () => {
    const selectedId = compSelect.value;
    const qty = parseFloat(qtyInput.value) || 0;
    const comp = LOCAL_PRICES.find(p => p.id === selectedId);

    if (!comp || qty <= 0) {
      alert('يرجى ادخال كمية صحيحة');
      return;
    }

    incidents.push({
      name: comp.name,
      unit: comp.unit,
      qty: qty,
      price: comp.price
    });

    renderIncidents();
  });

  // 3. عرض جدول الأضرار والحسابات
  function renderIncidents() {
    incTableBody.innerHTML = '';
    let total = 0;

    incidents.forEach((item, index) => {
      const rowTotal = item.qty * item.price;
      total += rowTotal;

      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${item.name}</td>
        <td>${item.qty} ${item.unit}</td>
        <td>${item.price.toFixed(3)}</td>
        <td><strong>${rowTotal.toFixed(3)}</strong></td>
        <td><button class="btn btn-danger" onclick="deleteIncident(${index})">✕</button></td>
      `;
      incTableBody.appendChild(tr);
    });

    grandTotalEl.textContent = total.toFixed(3);
    totalWordsEl.textContent = numberToArabicWords(total);
  }

  function deleteIncident(index) {
    incidents.splice(index, 1);
    renderIncidents();
  }

  // 4. تفقيط المبالغ
  function numberToArabicWords(num) {
    let n = Math.round(num);
    if (n === 0) return "صفر ريال عماني";
    const ones = ["","واحد","اثنان","ثلاثة","أربعة","خمسة","ستة","سبعة","ثمانية","تسعة"];
    const teens = ["عشرة","أحد عشر","اثنا عشر","ثلاثة عشر","أربعة عشر","خمسة عشر","ستة عشر","سبعة عشر","ثمانية عشر","تسعة عشر"];
    const tens = ["","","عشرون","ثلاثون","أربعون","خمسون","ستون","سبعون","ثمانون","تسعون"];
    const hundreds = ["","مائة","مائتان","ثلاثمائة","أربعمائة","خمسمائة","ستمائة","سبعمائة","ثمانمائة","تسعمائة"];

    function convertBelowThousand(num) {
      let parts=[]; let h=Math.floor(num/100); let t=Math.floor((num%100)/10); let u=num%10;
      if(h>0) parts.push(hundreds[h]);
      if(num%100<10){ if(u>0) parts.push(ones[u]); }
      else if(num%100<20){ parts.push(teens[num%100-10]); }
      else { if(u>0) parts.push(ones[u]); if(t>1) parts.push(tens[t]); }
      return parts.join(' و ');
    }

    let words=[];
    const scales = [{value:1000000,name:"مليون"}, {value:1000,name:"ألف"}, {value:1,name:""}];
    for(let s of scales){
      if(n>=s.value){
        let chunk=Math.floor(n/s.value); n%=s.value;
        if(chunk===1 && s.name) words.push(s.name);
        else words.push(convertBelowThousand(chunk)+" "+s.name);
      }
    }
    return words.join(' و ')+" ريال عماني";
  }

  // التشغيل الأولي
  initPrices();
</script>

</body>
</html>
